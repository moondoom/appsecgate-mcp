# Пример периодического classic-отчёта. Скопировать в проверяемый проект.
# Текущий CLI проверяет diff; HEAD~1 ограничивает отчёт последним коммитом.
name: AppSecGate scheduled report

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  appsecgate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Run AppSecGate scheduled report
        env:
          APPSECGATE_MASTER_URL: ${{ vars.APPSECGATE_MASTER_URL }}
          APPSECGATE_MASTER_API_KEY: ${{ secrets.APPSECGATE_MASTER_API_KEY }}
          APPSECGATE_PROJECT_ID: ${{ github.repository }}
        run: |
          docker run --rm --read-only \
            --tmpfs=/tmp:size=100M,mode=1777 \
            --cap-drop=ALL --security-opt=no-new-privileges:true \
            -v "$PWD":/workspace:ro \
            moondoom/appsecgate-mcp:0.1.0 \
            ci --project /workspace --base-ref HEAD~1 --format ndjson
