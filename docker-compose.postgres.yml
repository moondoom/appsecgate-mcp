services:
  postgres:
    image: postgres:16
    container_name: appsecgate-postgres
    environment:
      POSTGRES_DB: appsecgate
      POSTGRES_USER: appsecgate
      POSTGRES_PASSWORD: ${APPSECGATE_POSTGRES_PASSWORD:?set APPSECGATE_POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - appsecgate
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appsecgate -d appsecgate"]
      interval: 5s
      timeout: 3s
      retries: 20

  master:
    environment:
      APPSECGATE_MASTER_DATABASE_URL: postgresql://appsecgate:${APPSECGATE_POSTGRES_PASSWORD}@postgres:5432/appsecgate
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
