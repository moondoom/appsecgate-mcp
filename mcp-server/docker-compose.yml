# AppSecGate MCP — docker-compose (Фаза 1).
#
# Модель безопасности (arch §5):
#   • non-root 1000:1000, read_only rootfs, cap_drop ALL, no-new-privileges
#   • bind-mount проекта :ro, конфиг :ro, named volume для кэша :rw
#   • network_mode none — офлайн-первый
#
# Запуск: PROJECT_PATH=/abs/path/to/repo docker compose run --rm appsecgate-mcp

services:
  appsecgate-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: moondoom/appsecgate-mcp:0.1.0
    container_name: appsecgate-mcp

    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp:size=100M,mode=1777

    volumes:
      # Проект — только для чтения.
      - ${PROJECT_PATH:-.}:/workspace:ro
      # Проектный конфиг — только для чтения.
      - ${PROJECT_PATH:-.}/.appsecgate-mcp:/.appsecgate-mcp:ro
      # Кэш сканеров и SQLite-базы — единственное место записи.
      - appsecgate-cache:/home/appsecgate/.cache
      - appsecgate-data:/home/appsecgate/.appsecgate-mcp
      # Опционально (разработка правил): подменить bundle из образа на локальный, только для чтения.
      # - ${APPSECGATE_RULES_DIR:-./rules}:/opt/appsecgate/rules:ro

    environment:
      - HOME=/home/appsecgate
      - APPSECGATE_MCP_HOME=/home/appsecgate/.appsecgate-mcp
      - APPSECGATE_MCP_CACHE_DIR=/home/appsecgate/.cache
      - APPSECGATE_PROJECT_PATH=/workspace
      - TRIVY_CACHE_DIR=/home/appsecgate/.cache/trivy

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    # Фаза 1: полностью офлайн. Раскомментируйте bridge для обновления баз.
    network_mode: "none"
    # network_mode: "bridge"

    stdin_open: true
    tty: false

volumes:
  appsecgate-cache:
  appsecgate-data:
