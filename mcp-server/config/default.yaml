# AppSecGate MCP — конфигурация по умолчанию (образ /etc/appsecgate/default.yaml).
# Проект может переопределить любой блок в .appsecgate-mcp/config.yaml;
# переменные окружения APPSECGATE_* перекрывают всё (см. config/loader.py).

version: 2

stack:
  languages: []
  frameworks: []

# Rules Bundle: локальная поставка правил (дизайн v1 §1, §3).
# path пустой → используется дефолт образа (/opt/appsecgate/rules).
rules:
  path: ""
  distribution_mode: mit
  overrides: {}
  profiles: []

# Сеть: офлайн по умолчанию (дизайн v1 §2). Автодетект сети не делается.
network:
  mode: offline
  sync:
    trivy_db: true
    timeout_seconds: 30
    max_db_age_days: 30

scanners:
  sast:
    enabled: true
    tool: semgrep
    rulesets:
      - /opt/appsecgate/rules/opengrep-community
      - /opt/appsecgate/rules/semgrep-custom
    severity_threshold: medium
  secrets:
    enabled: true
    tool: gitleaks
    severity_threshold: medium
  sca:
    enabled: true
    tool: trivy
    severity_threshold: high
  iac:
    enabled: true
    tool: trivy
    severity_threshold: medium

gates:
  local:
    warn_on: [critical, high, medium]
    block_on: []
    info_on: [low, info]
  ci:
    block_on: [critical, high]
    warn_on: [medium]
    info_on: [low, info]
    block_on_unresolved_local: true

# Пример подавления (в проекте переопределяется при необходимости):
# suppress:
#   - rule: semgrep.generic.secrets
#     paths: ["tests/**"]
#     reason: "Тестовые фикстуры, не реальные секреты"
#     scope: local
suppress: []

sla:
  dev_response: 24h
  dev_after_block: 48h
  appsec_response: 5d
  lead_response: 10d
