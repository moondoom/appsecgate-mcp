[project]
name = "appsecgate-mcp"
version = "0.1.0"
description = "Локальный MCP-сервер безопасности для AI-агентов (AppSecGate Phase 1)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AppSecGate" }]
keywords = ["security", "mcp", "sast", "secrets", "sca", "devsecops"]
dependencies = [
    "mcp>=1.2.0,<2",
    "pydantic>=2.7",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.scripts]
appsecgate-mcp = "appsecgate_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/appsecgate_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]